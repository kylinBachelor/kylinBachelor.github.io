# Stalux 主题默认配置
# 这是默认配置文件，用户可以通过 _config.yml 覆盖这些设置,请不要动这个文件

# 核心站点信息
title: "Mindspark博客主题"
titleDefault: "Mindspark博客主题"
siteName: "Mindspark博客主题"
author: "Mindspark"
enableViewTransitions: false ## 是否启用视图转换效果，默认为 false
# SEO 核心配置
description: "博客主题Stalux - 为内容创作者提供的专业展示平台，支持多种自定义功能，包含评论系统集成、友情链接管理、社交媒体分享和丰富的SEO优化选项，让您的内容更具吸引力和可发现性。"
short_description: "博客主题Stalux"
url: "https://oxai.net.cn"
keywords: "Stalux, 博客主题, 内容创作, Astro主题, 静态网站生成器, SEO优化, 自定义博客, 响应式设计, 评论系统, 前端开发, Astro"
lang: "zh-CN"
locale: "zh_CN"
canonical: "https://oxai.net.cn"

# 站点资源配置
favicon: ""
avatarPath: ""

# <head>元素硬嵌入
head: |
  <meta name="nishia" content="nihaiso">
  <script>console.log("欢迎使用Stalux主题")</script>

# 站点导航配置
nav:
  - title: "首页"
    path: "/"
    icon: "home"
  - title: "归档"
    path: "/archives"
    icon: "archive"
  - title: "分类"
    path: "/categories"
    icon: "folder"
  - title: "标签"
    path: "/tags"
    icon: "tag"
  - title: "链接"
    path: "/links"
    icon: "link"
  - title: "关于"
    path: "/about"
    icon: "user"

# 站点特效配置
textyping:
  - "Free for free, not free for charge!"
  - "Stay Hungry Stay Foolish!"
  - "F12看看?"
  - "Hello World!"

# 评论系统配置
comment:
  waline:
    serverURL: "https://waline.xingwangzhe.fun"
    lang: "zh-CN"
    emoji:
      - "https://unpkg.com/@waline/emojis@1.1.0/weibo"
    reaction: false
    meta:
      - "nick"
      - "mail"
      - "link"
    wordLimit: 200
    pageSize: 10

# 社交媒体链接配置
medialinks:
  - title: "Github"
    url: "https://github.com/mindsparkc"
    icon: "github"
  - title: "Bilibili"
    url: "https://space.bilibili.com/"
    icon: "bilibili"
  - title: "Twitter"
    url: "https://x.com/"
    icon: "x-twitter"
